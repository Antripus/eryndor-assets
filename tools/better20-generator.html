<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eryndor - Better20 URL Generator</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #111827;
            color: #f3f4f6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #9ca3af;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            color: #d1d5db;
        }

        input,
        textarea,
        button {
            font: inherit;
        }

        input[type="text"] {
            background: #111827;
            color: #f3f4f6;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 10px;
        }

        input[type="file"] {
            display: none;
        }

        .folder-button,
        button {
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .folder-button:hover,
        button:hover {
            background: #6d28d9;
        }

        .secondary {
            background: #374151;
        }

        .secondary:hover {
            background: #4b5563;
        }

        .danger {
            background: #991b1b;
        }

        .danger:hover {
            background: #7f1d1d;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 16px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .status {
            margin-top: 14px;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            box-sizing: border-box;
            background: #0b1220;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 12px;
            resize: vertical;
        }

        .preview {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .preview th,
        .preview td {
            border-bottom: 1px solid #374151;
            padding: 8px;
            text-align: left;
        }

        .preview th {
            color: #d1d5db;
        }

        .preview td {
            color: #9ca3af;
        }

        .count {
            font-size: 18px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .small {
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 800px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🎲 Eryndor — Better20 URL Generator</h1>
    <p class="subtitle">
        Genera automáticamente las URLs de imágenes para Better20.
    </p>

    <div class="card">
        <h2>Configuración de GitHub</h2>

        <div class="row">
            <div class="field">
                <label for="githubUser">GitHub User</label>
                <input type="text" id="githubUser" value="Antripus">
            </div>

            <div class="field">
                <label for="repo">Repository</label>
                <input type="text" id="repo" value="eryndor-assets">
            </div>

            <div class="field">
                <label for="branch">Branch</label>
                <input type="text" id="branch" value="main">
            </div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox" id="includeFolder">
                Incluir carpeta en el nombre
            </label>
        </div>
    </div>

    <div class="card">
        <h2>📁 Seleccionar carpeta</h2>

        <input
            type="file"
            id="folderPicker"
            webkitdirectory
            directory
            multiple
        >

        <label for="folderPicker" class="folder-button">
            Seleccionar eryndor-assets
        </label>

        <div class="status">
            <span class="count" id="fileCount">0</span> imágenes encontradas
        </div>
    </div>

    <div class="card">
        <h2>📋 Resultado para Better20</h2>

        <div class="actions">
            <button id="copyButton">📋 Copiar todo</button>
            <button id="downloadButton" class="secondary">💾 Descargar TXT</button>
            <button id="clearButton" class="danger">🗑 Limpiar</button>
        </div>

        <textarea
            id="output"
            placeholder="Aquí aparecerán las entradas para Better20..."
            spellcheck="false"
        ></textarea>
    </div>

    <div class="card">
        <h2>🔎 Vista previa</h2>

        <div id="previewContainer" class="small">
            Todavía no seleccionaste ninguna carpeta.
        </div>
    </div>

</div>

<script>
    "use strict";

    const IMAGE_EXTENSIONS = new Set([
        ".png",
        ".jpg",
        ".jpeg",
        ".webp",
        ".gif"
    ]);

    const folderPicker = document.getElementById("folderPicker");
    const githubUser = document.getElementById("githubUser");
    const repo = document.getElementById("repo");
    const branch = document.getElementById("branch");
    const includeFolder = document.getElementById("includeFolder");

    const fileCount = document.getElementById("fileCount");
    const output = document.getElementById("output");
    const previewContainer = document.getElementById("previewContainer");

    const copyButton = document.getElementById("copyButton");
    const downloadButton = document.getElementById("downloadButton");
    const clearButton = document.getElementById("clearButton");

    let selectedFiles = [];

    function getExtension(filename) {
        const dot = filename.lastIndexOf(".");
        if (dot === -1) return "";
        return filename.slice(dot).toLowerCase();
    }

    function getBaseName(filename) {
        const dot = filename.lastIndexOf(".");
        if (dot === -1) return filename;
        return filename.slice(0, dot);
    }

    function cleanName(name) {
        return name
            .replace(/\.[^/.]+$/, "")
            .replace(/[_-]+/g, " ")
            .replace(/\s+/g, " ")
            .trim();
    }

    function encodeGitHubPath(path) {
        return path
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
    }

    function buildRawUrl(relativePath) {
        const user = githubUser.value.trim();
        const repository = repo.value.trim();
        const currentBranch = branch.value.trim() || "main";

        return `https://raw.githubusercontent.com/${encodeURIComponent(user)}/${encodeURIComponent(repository)}/${encodeURIComponent(currentBranch)}/${encodeGitHubPath(relativePath)}`;
    }

    function getRelativePath(file) {
        let path = file.webkitRelativePath || file.name;

        // Elimina el primer directorio (normalmente eryndor-assets)
        const parts = path.split("/");

        if (parts.length > 1) {
            parts.shift();
        }

        return parts.join("/");
    }

    function generateEntries() {
        const entries = selectedFiles
            .map(file => {
                const relativePath = getRelativePath(file);
                const fileName = relativePath.split("/").pop();

                let displayName = cleanName(fileName);

                if (includeFolder.checked) {
                    const parts = relativePath.split("/");
                    parts.pop();

                    if (parts.length > 0) {
                        displayName = `${parts.join(" / ")} / ${displayName}`;
                    }
                }

                const url = buildRawUrl(relativePath);

                return {
                    name: displayName,
                    path: relativePath,
                    url: url,
                    line: `${displayName}---${url}`
                };
            })
            .sort((a, b) => a.path.localeCompare(b.path));

        output.value = entries.map(entry => entry.line).join("\n");

        renderPreview(entries);
        fileCount.textContent = entries.length;
    }

    function renderPreview(entries) {
        if (entries.length === 0) {
            previewContainer.innerHTML = "No hay imágenes para mostrar.";
            return;
        }

        const maxPreview = 200;
        const visibleEntries = entries.slice(0, maxPreview);

        let html = `
            <table class="preview">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Ruta</th>
                        <th>URL</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const entry of visibleEntries) {
            html += `
                <tr>
                    <td>${escapeHtml(entry.name)}</td>
                    <td>${escapeHtml(entry.path)}</td>
                    <td>${escapeHtml(entry.url)}</td>
                </tr>
            `;
        }

        html += `
                </tbody>
            </table>
        `;

        if (entries.length > maxPreview) {
            html += `
                <p class="small">
                    Mostrando ${maxPreview} de ${entries.length} imágenes.
                </p>
            `;
        }

        previewContainer.innerHTML = html;
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    folderPicker.addEventListener("change", () => {
        const files = Array.from(folderPicker.files);

        selectedFiles = files.filter(file => {
            return IMAGE_EXTENSIONS.has(getExtension(file.name));
        });

        generateEntries();
    });

    githubUser.addEventListener("input", generateEntries);
    repo.addEventListener("input", generateEntries);
    branch.addEventListener("input", generateEntries);
    includeFolder.addEventListener("change", generateEntries);

    copyButton.addEventListener("click", async () => {
        if (!output.value.trim()) {
            alert("No hay nada para copiar.");
            return;
        }

        try {
            await navigator.clipboard.writeText(output.value);
            alert("URLs copiadas al portapapeles.");
        } catch (error) {
            output.select();
            document.execCommand("copy");
            alert("URLs copiadas al portapapeles.");
        }
    });

    downloadButton.addEventListener("click", () => {
        if (!output.value.trim()) {
            alert("No hay nada para descargar.");
            return;
        }

        const blob = new Blob(
            [output.value],
            { type: "text/plain;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "better20-art-urls.txt";

        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);
    });

    clearButton.addEventListener("click", () => {
        selectedFiles = [];
        folderPicker.value = "";
        output.value = "";

        fileCount.textContent = "0";
        previewContainer.innerHTML =
            "Todavía no seleccionaste ninguna carpeta.";
    });
</script>

</body>
</html>
